services:
  db:
    image: postgres:latest
    container_name: postgres_setup_manager
    restart: always
    environment:
      POSTGRES_USER: ksenia
      POSTGRES_PASSWORD: 2006
      POSTGRES_DB: setup_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: